---
layout: default
home: true
---

<section class="home-hero">
  <div class="home-hero__bg" style="background-image: url('/assets/images/home.jpg')"></div>
  <div class="home-hero__overlay"></div>

  <nav class="nav">
    <a href="/" class="nav__home">Brume</a>
    <ul class="nav__links">
      <li><a href="/writing">Writing</a></li>
      <li><a href="/movies">Movies</a></li>
      <li><a href="/album">Album</a></li>
    </ul>
    <button class="latest-btn" id="latest-btn">Latest</button>
  </nav>

  <div class="home-hero__bottom">
    <div class="home-hero__brume">BRUME</div>
    <p class="home-hero__line">unearthed remains of the dreamt, the gone, and the road</p>
    <p class="home-hero__by">by Margot Vially Walczak</p>
  </div>

  <a href="/contact" class="home-contact">contact</a>

  <div class="latest-drawer" id="latest-drawer">
    <button class="latest-drawer__close" id="latest-close">&#215;</button>

    <div class="latest-drawer__section">
      <p class="latest-drawer__label">Writing</p>
      <a class="latest-drawer__item" href="/writing/la-sauvage">
        <div class="latest-drawer__thumb" style="background-image: url('/assets/images/IMG_7798.JPG')"></div>
        <p class="latest-drawer__title">La Sauvage</p>
      </a>
    </div>

    <div class="latest-drawer__section">
      <p class="latest-drawer__label">Movies</p>
      <a class="latest-drawer__item" href="/movies">
        <div class="latest-drawer__thumb latest-drawer__thumb--empty"></div>
        <p class="latest-drawer__title">Coming soon</p>
      </a>
    </div>

    <div class="latest-drawer__section">
      <p class="latest-drawer__label">Album</p>
      <a class="latest-drawer__item" href="/album">
        <div class="latest-drawer__thumb" style="background-image: url('/assets/images/IMG_6869.JPG')"></div>
        <p class="latest-drawer__title">Kyrgyzstan</p>
      </a>
    </div>
  </div>

</section>

<script>
var btn = document.getElementById('latest-btn');
var drawer = document.getElementById('latest-drawer');
var close = document.getElementById('latest-close');

btn.onclick = function() {
  drawer.classList.toggle('open');
};

close.onclick = function() {
  drawer.classList.remove('open');
};

document.onkeydown = function(e) {
  if (e.key === 'Escape') drawer.classList.remove('open');
};
</script>
