<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}TAAYK</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="TAAYK">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} — {% endif %}TAAYK">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;500&family=Merriweather:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="{% if page.home %}home{% endif %}">

  {% unless page.home %}
  <nav class="nav" style="justify-content:center;text-align:center;">
    <a href="/" class="nav__taayk">TAAYK</a>
  </nav>
  {% endunless %}

  <main>
    {{ content }}
  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
